[package]
name = "flashvault"
version = "0.1.0"
edition = "2021"
authors = ["Pavan Nallamothu"]
description = "An in-memory LRU cache in Rust with TTL expiry, a capacity bound, and live stats."
license = "MIT"

[[bin]]
name = "flashvault"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
